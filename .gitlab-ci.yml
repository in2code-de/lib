stages:
  - composer
  - qa

image: in2code/php:7.4-fpm

composer:
  stage: composer
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - /tmp/composer/cache
  script: composer install
  artifacts:
    paths:
      - vendor/

qa-composer:
  stage: qa
  script: composer run qa-composer

qa-lint:
  stage: qa
  script: composer run qa-lint

qa-phpcs:
  stage: qa
  script: composer run qa-phpcs

qa-phpmd:
  stage: qa
  script: composer run qa-phpmd

qa-phpstan:
  stage: qa
  script: composer run qa-phpstan

qa-psalm:
  stage: qa
  script: composer run qa-psalm

qa-phpunit-coverage:
  image: in2code/php-dev:7.4-fpm
  stage: qa
  script: composer run qa-phpunit-coverage
